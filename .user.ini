upload_max_filesize=100M
post_max_size=100M
memory_limit=256M
max_execution_time=300
max_input_time=300

; Phase 1 SaaS hardening: OPcache recommendations.
; Some Hostinger/PHP-FPM environments ignore OPcache settings in .user.ini.
; Confirm OPcache is enabled in hPanel or phpinfo() after deployment.
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=30
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
